# =============================================================================
# 判定阈值基线
#
# 修改说明：
#   nominal  参考中心值（取自 2026-10-30 实测）
#   min/max  合格区间；超出为 FAIL
#   warn_min / warn_max  警戒区间；在 min..max 内但超出此区间为 WARN
#   note     人类可读的说明，会原样出现在报告里
#
# 修改后重新运行检测即可，不需要改代码。
# =============================================================================

frequency:
  imu_hz:
    nominal: 50.0
    min: 45.0
    max: 55.0
    note: "IMU 原始数据 50 Hz，实测 49.997"
  radar_hz:
    nominal: 30.0
    min: 28.0
    max: 32.0
    note: "LakiBeam1 标称 30 Hz，实测 30.28~30.33"
  odom_hz:
    nominal: 100.0
    min: 95.0
    max: 105.0
    note: "底盘 100 Hz 里程计，实测 100.13"
  camera_hz:
    nominal: 30.0
    min: 20.0
    max: 40.0
    note: "USB 摄像头标称 30 Hz，实测 29.4，允许偶发卡顿"
  ekf_hz:
    nominal: 20.0
    min: 15.0
    max: 25.0
    note: "robot_localization 默认 20 Hz"

radar:
  expected_points: 1440
  points_tolerance: 0
  angle_min_deg: -180.0
  angle_max_deg: 180.0
  angle_tolerance_deg: 1.0
  min_valid_ratio: 0.60
  note: "LakiBeam1 物理视场约 ±120~135°，后方无数据属正常，不能用 360° 全覆盖判定"

imu:
  accel_z_nominal: 9.8
  accel_z_min: 9.4
  accel_z_max: 10.6
  accel_z_warn_high: 10.3
  gyro_static_max: 0.05
  roll_pitch_max_deg: 5.0
  note: "2026-10-30 实测 z=10.18 偏高约 3.8%，标度待确认。上限放到 10.6 是为避开温度/供电波动造成的误报"

odom:
  static_drift_max_m: 0.01
  sample_seconds: 5
  note: "车静止 5 秒内位移，实测 0.0000 m"

voltage:
  full_v: 12.4
  # normal_v <= low_v 时为「单阈值模式」：没有「偏低提醒」档，
  # 只有 通过 / 必须充电 两种结论。
  # 若想让 11.0~11.7 之间显示「偏低（警告）」，把 normal_v 调高即可，
  # 例如 normal_v: 11.7、low_v: 11.0。
  normal_v: 11.0
  low_v: 11.0
  stop_test_below_v: 11.0
  sample_timeout_sec: 90
  note: "低于 11.0 V 必须充电，程序会主动停止后续测试"

health:
  temp_warn_c: 75.0
  temp_fail_c: 85.0
  disk_warn_pct: 85.0
  disk_fail_pct: 95.0
  mem_available_min_gib: 0.5
  load_warn: 3.0
  note: "磁盘超过 85% 警告、超过 95% 才失败；load 阈值针对 4 核平台"

traces:
  ros_log_size_warn_mb: 200
  bash_history_lines_warn: 800
  # 测试完整跑完后是否自动删除车上使用痕迹。
  #
  # 默认 **false**（2026-11-03 审查指出：默认开启会让用户在不知情的情况下
  # 丢掉车上的命令历史，违反「绝不修改车辆持久配置」的约束）。
  # 需要清痕迹时，用界面上的「清理使用记录」按钮显式执行，或把这里改成 true。
  auto_cleanup: false
  # 即使开启 auto_cleanup，是否保留 .bash_history。
  # 命令历史是现场排查的证据，不是「痕迹」，建议保留。
  keep_bash_history: true
  note: "默认不自动清理；显式清理时也会保留命令历史，除非 keep_bash_history: false"

motion:
  # ---------------------------------------------------------------------
  # 运动测试分两段，由程序引导用户依次完成：
  #   bench  段：车架空（轮子离地）。安全，可以在任何地方做。
  #             验证「电机能转、编码器有反馈、方向正确」。
  #   ground 段：车落地且周围开阔。验证「真实行驶距离、速度准确度」。
  #             bench 段不通过就不会进入 ground 段。
  # ---------------------------------------------------------------------

  # 两段都需要先做的响应确认。耗时极短，只要车动就算过。
  micro_pulse:
    speed: 0.05
    duration: 0.3
    min_displacement_m: 0.0005   # 0.5 mm，只需能辨认出动了
    note: "0.3s × 0.05m/s 理论上约 1.5 cm。失败即判定底盘无响应，不再继续任何运动测试"

  bench:
    # 架空段：轮子空转，里程计反映的是编码器读数而非真实位移
    forward_speed: 0.10
    forward_duration: 2.0
    min_displacement_m: 0.005     # 空转只要明显在转即可，不校验距离精度
    reverse_speed: -0.10
    reverse_duration: 2.0
    steer_angle: 0.30
    steer_duration: 1.5
    steer_speed: 0.05          # 架空转向需叠加小前进速度，否则轮子不转、无 yaw 变化
    note: "架空时轮子空转，不校验行驶距离，只验证电机响应对称性"

  ground:
    # 落地段：真实行驶，才校验距离和速度精度
    forward_speed: 0.10
    forward_duration: 3.0
    forward_expected_m: 0.30
    forward_tolerance: 0.20        # 相对误差 ±20%，实测跟踪在 86~90%
    reverse_speed: -0.10
    reverse_duration: 3.0
    reverse_expected_m: 0.30
    reverse_tolerance: 0.20
    steer_angle: 0.30
    steer_duration: 2.0
    steer_expected_yaw_deg: 11.0
    steer_tolerance_deg: 6.0
    note: "需在开阔平地做，周围无人无障碍。左右转向各测一次，任一不合格即判失败"

  # 转向互校：落地转一整圈，比对里程计与 IMU 的航向累积。
  #
  # 为什么需要：架空段只能证明「有数据、频率对、静止不漂」，
  # 证明不了走起来以后航向准不准。转一圈两者应该都接近 360°。
  #
  # 空间要求：以 steer_angle=0.35、轴距约 0.3 m 估算，
  #           转弯半径约 0.8 m，车体占位后需要约 2.5 m × 2.5 m 开阔平地。
  # 时间：单方向约 35~45 秒，左右各一次。
  # 整车几何。用于把「舵机指令角度」换算成「理论转弯半径与角速度」，
  # 再与 IMU 实测比对，从而发现打滑与转向执行偏差。
  # 轴距 = 前轴中心到后轴中心的距离，2026-11-10 用卷尺实测。
  wheelbase_m: 0.255
  # 转向标定（2026-11-10，6 组稳态圆弧，速度 0.12 m/s）：
  #   δ_real = 0.910 · δ_cmd + 0.58°，残差 RMS 0.15°
  #   0.35 rad (20.05°) → 实际 18.83°
  #   左右对称性 0.2~0.3°；打滑率 26%~45%
  # 换车或换舵机后需用 tools/steer_calib.py 重测。
  steer_gain: 0.910
  steer_offset_deg: 0.58

  # 轮距（左右轮中心距）。URDF tianracer_compact.urdf 实测 0.1631 m。
  # 与轴距一起决定理论打滑率，进而决定打滑判据的期望值。
  track_m: 0.1631

  spin:
    speed: 0.12                 # m/s，低速
    # 0.35 rad = 20.05° 指令值。2026-11-10 实测：实际约 18.8°。
    # 半径按实际 18.8° 算是 0.749 m（按指令算会低估到 0.699 m）。
    steer_angle: 0.35
    target_yaw_deg: 360
    max_seconds: 90             # 单方向硬超时

    # ---- 判据：车体姿态是否转够（唯一不受打滑污染的指标）----
    # 2026-11-10 实测 IMU 360.68° / -361.04°，过冲 < 1.1°。
    yaw_tolerance_deg: 15       # 姿态误差 <= 15° 通过
    yaw_warn_deg: 30            # <= 30° 告警；再大判失败

    # ---- 判据：打滑率与几何理论值对比 ----
    # 四驱同速 + 单舵机的阿克曼车转弯**必然**打滑，这不是故障：
    #   内外轮速差 W/R = 22.8%（δ=0.35）
    #   前后轴路径差 6.5%
    #   合计理论 29.3%，实测左转 28.4% / 右转 34.5%
    # 偏离理论值过多才说明异常（轮胎磨损、地面油污、某轮卡死）。
    slip_tolerance_pct: 15      # 打滑率偏离理论值超过 15 个百分点即告警

    # ---- 闭合误差：只记录，不参与判定 ----
    # 实测 1.12~1.27 m。它由打滑与轨迹形变共同决定，没有可靠解析估计，
    # 把它当合格线会永远 FAIL。保留为人工判断与历史对比的参考值。
    closure_warn_m: 0.30

    note: "四驱同速必打滑，回不到原点属正常；场地需约 4m×4m（含滑移余量）"

  safety:
    # 硬性上限，即使 baseline.yaml 被误改也不允许超出
    max_speed_mps: 0.5
    max_duration_sec: 10.0
    # 转圈单独一组上限：时间长、风险高，不和直线运动共用
    spin_max_speed_mps: 0.25
    spin_max_seconds: 120.0
    # 转向角硬顶（rad）。0.5 对应 28.6°。
    # 2026-11-10 标定只验证到 0.35 rad（20.05°），更高角度未测。
    # 调高之前必须先跑 tools/steer_calib.py 确认车能执行且场地够大。
    max_steer_rad: 0.5
    note: "代码内会二次校验，超过此值的配置直接拒绝执行"

envvars:
  # 键: 期望值。程序会检测实际值，不符则判 WARN 并临时修正。
  TIANRACER_NAME: tianracer
  TIANBOT_NAME: tianracer
  TIANRACER_BASE: compact
  TIANRACER_BASE_PORT: /dev/ttyUSB0
  TIANRACER_BASE_BAUDRATE: "115200"
  TIANRACER_LIDAR: richbeam_lidar
  TIANRACER_LIDAR_IP: 192.168.198.2
  TIANRACER_LIDAR_PORT: /dev/tianbot_lidar
  TIANRACER_LIDAR_MODEL: lakibeam1
  TIANRACER_JOY_MODE: dji_dt7
  TIANRACER_VIDEO_DEVICE: /dev/tianbot_usb_cam
  TIANRACER_BRIDGE: disabled
  TIANRACER_GPS: none
  TIANRACER_RGBD_CAMERA: none
  TIANRACER_RGBD_CAMERA_MODEL: none
  TIANRACER_STEERING_DIRECTION: normal
  TIANRACER_THROTTLE_DIRECTION: normal

# 已知与文档不符但当前不影响运行的项，按实际值放行，报告中标注
envvars_known_deviations:
  TIANRACER_LIDAR_MODEL:
    expected: lakibeam1
    actual: a2
    reason: "实物为 LakiBeam1，配置写 a2。richbeam 分支不读该参数，当前不影响运行"

hardware:
  vendor_id: "10c4"
  model_id: "ea60"
  expected_serial: "1001"
  acceptable_serials: ["0001"]
  note: "文档要求序列号 1001（新版主控），本车为 0001（旧版），需与开发确认可接受性"

network:
  lidar_ip: 192.168.198.2
  lidar_host_ip_prefix: 192.168.198.
  ping_count: 3
  ping_max_loss_pct: 0
  ping_max_rtt_ms: 5.0

camera:
  expected_width: 640
  expected_height: 480
  expected_encoding: bgr8

tf:
  # 注意：这里只列 bringup（robot_state_publisher + ekf_se）会发布的 frame。
  # tianracer/odom 不能放进来——它是父节点，在 all_frames_as_yaml 里
  # 只作为 parent 出现，不单独列为一个 frame（实车验证过）。
  required_frames:
    - tianracer/base_link
    - tianracer/base_footprint
    - tianracer/imu_link
    - tianracer/laser
    - tianracer/camera_link
  # 需要能查到但不是独立 frame 的变换，单独校验
  required_transforms:
    - [tianracer/odom, tianracer/base_footprint]
    - [tianracer/base_link, tianracer/laser]
    - [tianracer/base_link, tianracer/imu_link]

mapping:
  expected_resolution: 0.05
  expected_map_size: 1984
