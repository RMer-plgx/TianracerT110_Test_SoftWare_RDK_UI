# =============================================================================
# 产品定义：Tianracer T110（RDK 版本）
#
# 这个文件描述「本产品是什么」——ROS 话题、工作空间、要跑哪些检测项。
# 阈值不在这里，在 baseline.yaml。
#
# 新增产品的做法：复制 products/_template/ 整个目录，改这里的值。
# 不需要改任何 .py 文件。
# =============================================================================

id: tianracer_t110_rdk
name: Tianracer T110（RDK）
model: Tianracer T110
platform: rdk
description: D-Robotics RDK X5（Sunrise 5）的 T110 阿克曼底盘整车
revision: "2026-11-03"

ros:
  distro: noetic
  workspace: ~/tianracer_ros1_ws

  launch:
    package: tianracer_bringup
    file: tianracer_bringup.launch

  # 会话内覆盖的环境变量（不改车辆文件）。
  # 这些是 2026-10-30 实车验证过的正确值；devel/setup.bash 里的
  # env-hooks 默认值是错的（/dev/tianbot_base、460800、oradar_lidar），
  # 会覆盖 ~/.bashrc 的正确配置，导致底盘完全打不开。
  # 只覆盖「确实需要纠正」的变量。少一个覆盖比多一个安全 ——
  # 覆盖错的值会真的弄坏启动，而 .bashrc 里本来就有正确值。
  env_overrides:
    TIANRACER_BASE_PORT: /dev/ttyUSB0
    TIANRACER_BASE_BAUDRATE: "115200"
    TIANRACER_LIDAR: richbeam_lidar
    TIANRACER_LIDAR_IP: 192.168.198.2
    TIANRACER_NAME: tianracer
    # 注意：**不要**覆盖 TIANRACER_LIDAR_PORT。
    #
    # 这台车的 richbeam_lidar.launch.xml 里写死了
    #   <arg name="lidar_serial" default="/dev/ttyUSB0" />
    # 而 /dev/tianbot_lidar 这个软链也指向 ttyUSB0 —— 雷达和底盘会抢
    # 同一个串口，报 "Device /dev/ttyUSB0 open failed" 并反复重试，
    # 导致 bringup 起不来（2026-11-05 实车复现）。
    #
    # 去掉这个覆盖后，雷达走 richbeam 分支（网口 192.168.198.2），
    # 串口只留给底盘，8 个节点全部就绪、零错误。

  # ROS 话题。代码里一律通过 profile 取，不写死。
  topics:
    odom: /tianracer/odom
    imu: /tianracer/imu_raw
    scan: /tianracer/scan
    camera: /tianracer/camera/image_raw
    cmd: /tianracer/ackermann_cmd
    voltage: /tianracer/voltage/data
    map: /tianracer/map
    # 底盘节点本体（用于判断 bringup 是否起来）
    base_node: /tianracer/tianracer

  # 报告第 13 项里额外展示父节点的 frame（可选，缺了只是不显示）。
  # 新产品按自己实际的 frame 名填，不要照抄。
  display_frames:
    - tianracer/laser
    - tianracer/base_footprint
    - tianracer/imu_link

  # 环境变量前缀。第 4 项按它 `env | grep '^TIANRACER'` 过滤。
  # 不写也行，会从 env_overrides 的键推导；显式写更清楚。
  env_prefix: TIANRACER

  # env-hooks 文件（相对工作空间）。只用于报告里的「根本修复方式」指引。
  env_hook_file: src/tianracer/env-hooks/99.my_tianracer.sh.em

  # 建图链路的 roslaunch（第 15 项用）
  slam:
    package: tianracer_slam
    file: tianracer_gmapping.launch

  # 地图文件目录（相对工作空间）
  maps_dir: src/tianracer/tianracer_slam/maps

  # ---------------------------------------------------------------------------
  # 底层采集（协议层，可选）
  #
  # 启用后 probes/serial_tap.py 会在底盘节点与真实串口之间做 pty 桥接，
  # 把原始协议帧落到 log_dir，第 20 项据此给出「没请求 / 没响应 / 解析错」
  # 这类 ROS 层看不到的诊断。
  #
  # 不启用时：第 20 项判 SKIP，其余检测项行为与不带此功能时完全一致。
  #
  # 串口与波特率**不在这里写死** —— 复用 env_overrides 里的 BASE_PORT /
  # BASE_BAUDRATE，避免同一事实在两处维护、改一处忘另一处。
  # ---------------------------------------------------------------------------
  tap:
    # 2026-11-10 开启：车端补丁（tianbot_core 01/02）已装并验证，
    # 实测能拿到 3571 帧零错误的数据。
    # 未装补丁的车也会正常运行：enabled 为 true 但车上无数据时判 SKIP，
    # 不会误判 FAIL，所以开启是安全的降级。
    enabled: true
    port_env: TIANRACER_BASE_PORT
    baudrate_env: TIANRACER_BASE_BAUDRATE
    log_dir: /tmp/tap
    max_log_mb: 32

  # 参与「源码一致性」检查的仓库（相对 <workspace>/src）
  repos:
    - tianracer
    - tianbot_core
    - webrtc_ros_bridge

  # 交付镜像自带的车端改动所在分支。{仓库名: 分支名}
  #
  # 为什么需要：第 7 项把「本地分支未推送」判 FAIL，因为换一台车就复现
  # 不出来。但串口录音补丁本身就在 tianbot_core 的本地分支上，这类分支
  # 在每台装了补丁的车上都未推送 —— 全判 FAIL 会让整条产品线永远不可交付，
  # 于是没人再看第 7 项。
  #
  # 声明过的：单列一行「已声明的本地分支」，判 WARN（可见、可确认，不阻断）。
  # 没声明的：仍判 FAIL。写错仓库名不生效，不做事后猜测。
  allowed_local_branches:
    tianbot_core: feat/serial-tap-recording

  # 已确认等价的本地/上游分叉（2026-11-13）。
  #
  # tianbot_core 的车端分支与上游 dev 各自实现了同一件事：
  #   - raw mode 修复：车上 212785e ≈ 上游 59bd6c8 + c47921d
  #   - 串口录音：    车上 8c502d6  = 上游 1229b23（就是从车上导出的 patch）
  # 实测差异**只有注释语言**（中文 vs 英文），代码逻辑完全一致：
  #   cfmakeraw / EXTPROC / c_cflag&=~CRTSCTS / c_iflag&=~IXON 四处都对得上，
  #   tap_dump 4 处、TIANBOT_TAP_DIR 1 处，serial.h 零差异。
  #
  # 声明后，第 7 项不会因为「领先 2 / 落后 3」报 WARN。
  # 一旦任何一边多出新提交，立即恢复 WARN —— 那时就真的需要人看。
  known_divergences:
    tianbot_core:
      reason: "本地与上游各自实现 raw mode 修复与串口录音，代码等价，仅注释语言不同"
      verified_at: "2026-11-13"
      # 跟上游主干 dev 比，不是跟自己的镜像分支比
      compare_with: dev
      local_commits:
        - 212785e
        - 8c502d6
      remote_commits:
        - 59bd6c8
        - c47921d
        - 1229b23

  # 第 7 项的已知可接受项（2026-11-13）。
  # 不隐藏信息 —— 报告 detail 里仍会写明每个仓库的实际状态。
  #
  # webrtc_ros_bridge：车上没有 GitHub SSH key，git fetch 从未成功过，
  #   无法与远端比对。它当前是车在用的（bringup 里 include），不能动。
  #   要恢复检查需在车上配 key 或改 HTTPS。
  accept_unreachable:
    - webrtc_ros_bridge
  # 未提交改动属于现场适配（底盘类型 ackermann、波特率 115200、
  # ackermann_msgs 依赖），是让车能跑的必要内容，不入 git 是有意的。
  accept_dirty: true

  # bringup 后必须出现的节点。缺任何一个都判为启动失败。
  nodes:
    required:
      - /tianracer/tianracer
      - /robot_state_publisher
      - /joint_state_publisher
      - /tianracer/ekf_se
      - /tianracer/complementary_filter_gain_node
    optional:
      - /tianracer/richbeam_lidar
      - /webrtc_ros_bridge

# -----------------------------------------------------------------------------
# 检测项清单
#
# **这里的顺序就是执行顺序**，不是按编号排的。必须遵守：
#   static  →  runtime  →  motion
# 加载时会校验，顺序错了直接报错。
#
# 字段：
#   number  报告里的编号（沿用历史编号，不重排，方便对照旧报告）
#   title   报告里的标题
#   module  checks/<module>.py
#   phase   static（不需要 ROS）/ runtime（需要 bringup）/ motion（会让车动）
#   fatal   失败后是否中止后续测试
# -----------------------------------------------------------------------------
checks:
  items:
    # 2026-11-13：重新编号，使**编号 = 执行顺序**（ADR-0009）。
    # 旧编号是历史遗留的：16/17/19 是 static 却编在后面，18 是 motion
    # 却编在 19 前面，导致执行顺序在纸上跳来跳去。
    # 新编号按 static → runtime → motion 连续排列，报告从上到下一项一项过。

    # --- static：不需要 ROS，先做，快且无风险 ---
    - {number: 1,  title: 网络连通性,        module: network,  phase: static,  fatal: true}
    - {number: 2,  title: 系统身份,          module: identity, phase: static}
    - {number: 3,  title: RustDesk 远程桌面, module: rustdesk, phase: static}
    - {number: 4,  title: 环境变量,          module: envvars,  phase: static}
    - {number: 5,  title: 设备节点,          module: devices,  phase: static}
    - {number: 6,  title: 主控平台与序列号,  module: hardware, phase: static,  fatal: true}
    - {number: 7,  title: 源码一致性,        module: source,   phase: static}
    - {number: 8,  title: 雷达以太网,        module: lannet,   phase: static}
    - {number: 9,  title: teb 导航插件,      module: teb,      phase: static}
    - {number: 10, title: 系统健康,          module: health,   phase: static}
    - {number: 11, title: 使用痕迹,          module: traces,   phase: static}

    # --- runtime：需要 bringup 起来 ---
    # 通讯链路放最前：它读的是原始串口字节，bringup 刚起时帧最干净，
    # 后续各项可以参考它的帧统计（ADR-0009）。
    - {number: 12, title: 通讯链路（协议层）, module: protocol, phase: runtime}
    - {number: 13, title: 激光雷达,         module: lidar,    phase: runtime, fatal: true}
    - {number: 14, title: USB 摄像头,       module: camera,   phase: runtime}
    - {number: 15, title: TF 树,            module: tf,       phase: runtime}
    - {number: 16, title: 电池电压,         module: voltage,  phase: runtime}
    - {number: 17, title: 激光建图链路,     module: mapping,  phase: runtime}
    # IMU 与里程计放在一起，紧跟建图链路：
    # 两者都靠落地转圈互校才能从 PENDING 转 PASS，连在一起做报告好读。
    - {number: 18, title: IMU,              module: imu,      phase: runtime, fatal: true}
    - {number: 19, title: 里程计,           module: odom,     phase: runtime, fatal: true}

    # --- motion：会让车动，必须人工确认 ---
    - {number: 20, title: 运动控制,         module: motion,   phase: motion}

# -----------------------------------------------------------------------------
# 环境变量分组说明（可选）
#
# 这段文字会原样出现在报告第 4 项的 detail 里，用来回答
# 「为什么这么多变量」。多产品后每个产品的变量清单不同，
# 所以由产品自己声明，不再写死在代码里。
# -----------------------------------------------------------------------------
env_note: |
  这 17 个变量不是 17 项手工配置，而是 tianracer 把每个功能模块
  做成了一个开关（装什么填什么，没装的填 none）：
    · 底盘通信：TIANRACER_BASE / _BASE_PORT / _BASE_BAUDRATE
      —— 写错就完全打不开底盘，这三项最重要
    · 雷达：TIANRACER_LIDAR / _LIDAR_IP / _LIDAR_PORT / _LIDAR_MODEL
    · 功能模块（本车没装的填 none）：GPS / RGBD_CAMERA / RGBD_CAMERA_MODEL
      / BRIDGE / VIDEO_DEVICE
    · 手感与方向：TIANRACER_STEERING_DIRECTION / _THROTTLE_DIRECTION / _JOY_MODE
    · 名称：TIANRACER_NAME / TIANBOT_NAME
